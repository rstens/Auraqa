###############################################################################
# AuraQA Docker Compose — Full Stack
#
# Services:
#   db      — PostgreSQL 18 database (port 5432)
#   migrate — Runs schema migrations on startup, then exits
#   app     — Next.js application (port 3000)
#
# Usage:
#   Production:  docker compose -f docker/docker-compose.yml up -d
#   Development: docker compose -f docker/docker-compose.yml \
#                               -f docker/docker-compose.dev.yml up
#
# @see docs/DEPLOYMENT.md for production deployment guide
# @see docs/DEVELOPMENT.md for local development setup
###############################################################################

services:
  db:
    image: postgres:18
    container_name: auraqa-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: auraqa
      POSTGRES_USER: auraqa
      POSTGRES_PASSWORD: auraqa_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auraqa -d auraqa"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: auraqa-migrate
    environment:
      DATABASE_URL: postgres://auraqa:auraqa_password@db:5432/auraqa
    depends_on:
      db:
        condition: service_healthy
    # Hardened, non-interactive schema apply for this TTY-less container:
    #
    #   --force  auto-approves data-loss statements so a genuine destructive
    #            diff doesn't render a confirmation prompt (which throws
    #            "Interactive prompts require a TTY terminal" with no TTY).
    #
    #   || echo  drizzle-kit push can still emit a non-interactive prompt that
    #            --force does NOT cover — notably its "add unique constraint to
    #            a populated table, truncate?" suggestion. On PK-less junction
    #            tables (article_tags etc.) push re-emits that constraint every
    #            run even though it already exists (a known phantom diff), so we
    #            must not let a push failure abort the deploy. seed runs next
    #            regardless and acts as the real schema health gate: if the
    #            schema were actually wrong, its INSERTs would fail loudly.
    #
    # Durable fix (removes push from the deploy path entirely): adopt committed
    # migrations via `drizzle-kit generate` + `drizzle-kit migrate`.
    command: sh -c "npx drizzle-kit push --force || echo '[migrate] drizzle-kit push did not fully converge (non-interactive); schema assumed current — continuing'; npx tsx src/db/seed.ts"
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: auraqa-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://auraqa:auraqa_password@db:5432/auraqa
      NEXTAUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      NODE_ENV: production
    env_file:
      - ../.env.local
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
    driver: local
