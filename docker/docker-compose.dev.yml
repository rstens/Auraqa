###############################################################################
# AuraQA Docker Compose — Development Overrides
#
# Usage:
#   docker compose -f docker/docker-compose.yml \
#                  -f docker/docker-compose.dev.yml up
#
# Adds:
#   - Source code volume mount for hot reload
#   - Auto-applies database schema and seeds on startup
#   - Development environment variables
###############################################################################

services:
  # Pinning `image:` alongside `build:` lets CI swap a pre-built image in
  # via env vars instead of rebuilding every run — compose uses the named
  # image if it's present locally (e.g. just `docker pull`-ed from GHCR)
  # and falls back to building when it isn't. Local dev with no env vars
  # set keeps the old behavior: builds into `auraqa-app-dev:local`.
  app:
    image: ${IMAGE_REPO:-auraqa-app-dev}:${IMAGE_TAG:-local}
    build:
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ../src:/app/src
      - ../public:/app/public
    environment:
      NODE_ENV: development
      AUTH_TRUST_HOST: "true"
    # `--force` + tolerant `||` so `push` never blocks or aborts on a TTY
    # confirmation prompt in this non-interactive container; the dev server
    # still starts even if push can't fully converge. See the migrate service
    # in docker-compose.yml for the full rationale.
    command: sh -c "npx drizzle-kit push --force || echo '[dev] drizzle-kit push did not fully converge (non-interactive); continuing'; npx tsx src/db/seed.ts && npm run dev"
  # The migrate service builds from the same Dockerfile.dev — point it at
  # the same cached image so we cache once, not twice. Only the entrypoint
  # differs (defined in docker-compose.yml).
  migrate:
    image: ${IMAGE_REPO:-auraqa-app-dev}:${IMAGE_TAG:-local}
