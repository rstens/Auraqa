###############################################################################
# AuraQA Docker Compose — Development Overrides
#
# Usage:
#   docker compose -f docker/docker-compose.yml \
#                  -f docker/docker-compose.dev.yml up
#
# Adds:
#   - Source code volume mount for hot reload
#   - Auto-applies database schema and seeds on startup
#   - Development environment variables
###############################################################################

services:
  app:
    build:
      dockerfile: docker/Dockerfile.dev
    volumes:
      - ../src:/app/src
      - ../public:/app/public
    environment:
      NODE_ENV: development
      AUTH_TRUST_HOST: "true"
    command: sh -c "npx drizzle-kit push && npx tsx src/db/seed.ts && npm run dev"
