# SonarQube Cloud configuration for AuraQA.
# See: https://docs.sonarsource.com/sonarcloud/advanced-setup/analysis-parameters/

sonar.projectKey=rstens_Auraqa
sonar.organization=rstens

# What Sonar analyses. `src/` is the production surface; everything in
# tests/ and e2e/ + the test files under src/ are flagged as tests so
# Sonar's metrics don't double-count them as production code.
sonar.sources=src
sonar.tests=src,e2e,tests
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,e2e/**/*.spec.ts,tests/api/**/*.bru

# Coverage report — vitest writes lcov.info to coverage/ via the
# `test:coverage` script (provider: v8, reporter includes `lcov`).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Don't apply the coverage gate to non-production files. The vitest gate
# in vitest.config.ts is the source of truth for what counts toward the
# 90% threshold; mirror those exclusions here so Sonar sees the same
# percentage.
sonar.coverage.exclusions=\
  **/__tests__/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  e2e/**,\
  tests/**,\
  scripts/**,\
  docs/**,\
  src/db/migrations/**,\
  src/db/seed.ts,\
  **/*.config.*,\
  next.config.ts,\
  postcss.config.mjs,\
  drizzle.config.ts,\
  vitest.setup.ts

# Skip generated assets + the Drizzle migration journals — they aren't
# hand-written code and shouldn't dilute the quality numbers.
sonar.exclusions=\
  .next/**,\
  coverage/**,\
  playwright-report/**,\
  test-results/**,\
  src/db/migrations/**,\
  public/**
