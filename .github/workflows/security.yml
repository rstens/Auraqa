###############################################################################
# AuraQA Security Scan Workflow
#
# Manually-dispatched security pipeline. Combines static (no app needed) and
# dynamic (DAST against a running instance) tooling, gated by a single
# `intensity` input.
#
# ⚠️  EXTREME intensity runs DESTRUCTIVE active scans (ZAP full scan, SQLMap)
#     that send real attack payloads — SQLi, XSS, path traversal, command
#     injection. They WILL corrupt test data and may break the running app.
#     NEVER point this at production. Only run against the ephemeral Docker
#     instance this workflow stands up.
#
# Intensity matrix:
#
#   smoke   (~5 min)   — passive only, safe for any branch
#                        GitLeaks · npm audit · OSV-Scanner · Trivy FS
#                        ZAP baseline (passive)
#
#   normal  (~25 min)  — adds SAST + image scan + targeted DAST
#                        + Semgrep · Trivy image · Nuclei (high/critical)
#
#   extreme (~90 min)  — adds breach-attempt scans
#                        + ZAP full active scan · Nuclei (all severities)
#                        + Wapiti · SQLMap against auth/API surfaces
###############################################################################

name: Security Scan

on:
  workflow_dispatch:
    inputs:
      intensity:
        description: "Scan intensity — extreme is destructive, only on ephemeral environments"
        type: choice
        required: true
        default: "normal"
        options:
          - smoke
          - normal
          - extreme
      target_branch:
        description: "Branch to scan (default: dev)"
        type: string
        required: false
        default: "dev"

permissions:
  # Required so OSV-Scanner / Trivy / Semgrep can upload SARIF to the
  # Security tab. The rest of the steps don't need any write scopes.
  contents: read
  security-events: write
  actions: read

env:
  INTENSITY: ${{ inputs.intensity }}
  TARGET_BRANCH: ${{ inputs.target_branch }}
  APP_URL: http://localhost:3000
  # Silence the "Node.js 20 deprecated" warnings emitted by older JS actions
  # (gitleaks-action@v2, action-baseline@v0.14.0, nuclei-action@v3, etc.) by
  # forcing them onto Node 24 — the runtime is already there, the actions
  # just haven't bumped their `runs.using` declaration.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # =========================================================================
  # Job 1 — Static analysis (no running app required)
  # =========================================================================
  static-analysis:
    name: Static analysis (${{ inputs.intensity }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          # GitLeaks needs full history to scan commits.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # -- Always-on (every intensity) ---------------------------------------

      - name: GitLeaks — secrets in git history
        uses: gitleaks/gitleaks-action@v2
        # gitleaks-action exits non-zero on findings (default --exit-code=2).
        # Without continue-on-error, a single finding aborts every static
        # step below it. We want findings to be reported (SARIF artifact is
        # still uploaded by the action) without killing the rest of the
        # static-analysis pipeline.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitLeaks license env var; the action runs in free mode without it
          # but emits a warning. Set GITLEAKS_LICENSE in repo secrets to silence.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: npm audit — registry advisories
        # Don't fail the job on findings — captured to the artifact and summary.
        # The job summary step below grades the report.
        continue-on-error: true
        run: |
          npm audit --json > npm-audit.json || true
          cat npm-audit.json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          meta = d.get('metadata', {}).get('vulnerabilities', {})
          for sev in ('critical', 'high', 'moderate', 'low', 'info'):
            print(f'  {sev}: {meta.get(sev, 0)}')
          "

      - name: OSV-Scanner — open-source vulnerability DB
        # Run osv-scanner directly via its container so we control the output
        # path. The official osv-scanner-action wrapper's --output flag
        # writes inside the container's CWD, not the runner workspace, and
        # the file disappears when the container exits.
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            ghcr.io/google/osv-scanner:v2.3.8 \
            scan source \
            --recursive \
            --format=sarif \
            --output=osv-scanner.sarif \
            ./
          ls -la osv-scanner.sarif || echo "(SARIF not produced)"

      - name: Upload OSV-Scanner SARIF to Security tab
        if: always() && hashFiles('osv-scanner.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: osv-scanner.sarif
          category: osv-scanner

      - name: Trivy — filesystem scan (deps + misconfigs)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: ${{ inputs.intensity == 'extreme' && 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL' || 'MEDIUM,HIGH,CRITICAL' }}
          # Don't fail on findings — surfaced in summary + SARIF.
          exit-code: "0"

      - name: Upload Trivy FS SARIF
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # -- Normal + Extreme --------------------------------------------------

      - name: Semgrep — SAST
        if: inputs.intensity != 'smoke'
        # The semgrep/semgrep-action@v1 wrapper is deprecated and its SARIF
        # output never landed in the workspace. Run semgrep directly via its
        # container so the SARIF goes exactly where we want.
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            returntocorp/semgrep:latest \
            semgrep scan \
              --sarif --sarif-output=semgrep.sarif \
              --config=p/security-audit \
              --config=p/nextjs \
              --config=p/typescript \
              --config=p/owasp-top-ten \
              --config=p/secrets \
              --error \
              --no-rewrite-rule-ids \
              --exclude=node_modules --exclude=.next || true
          ls -la semgrep.sarif || echo "(SARIF not produced)"

      - name: Upload Semgrep SARIF
        if: inputs.intensity != 'smoke' && always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Build Docker image for scanning
        if: inputs.intensity != 'smoke'
        run: docker build -f docker/Dockerfile -t auraqa:scan .

      - name: Trivy — Docker image scan
        if: inputs.intensity != 'smoke'
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: auraqa:scan
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload Trivy image SARIF
        if: inputs.intensity != 'smoke' && always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # -- Collect artifacts -------------------------------------------------

      - name: Upload static-analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-${{ inputs.intensity }}
          retention-days: 30
          path: |
            npm-audit.json
            osv-scanner.sarif
            trivy-fs.sarif
            semgrep.sarif
            trivy-image.sarif
          if-no-files-found: ignore

      - name: Static-analysis summary
        if: always()
        # Reference $INTENSITY (env-injected at workflow level) instead of
        # ${{ inputs.intensity }} so this script can't be turned into a shell
        # injection vector by a hostile workflow_dispatch payload —
        # `yaml.github-actions.security.run-shell-injection`.
        run: |
          {
            echo "## 🔒 Security Scan — Static Analysis (intensity: \`${INTENSITY}\`)"
            echo ""
            echo "| Tool | Status |"
            echo "|---|---|"
            for f in npm-audit.json osv-scanner.sarif trivy-fs.sarif semgrep.sarif trivy-image.sarif; do
              if [ -f "$f" ]; then echo "| \`$f\` | ✅ produced |"; else echo "| \`$f\` | — not run |"; fi
            done
            echo ""
            if [ -f npm-audit.json ]; then
              echo "### npm audit"
              python3 -c "
              import json
              d = json.load(open('npm-audit.json'))
              meta = d.get('metadata', {}).get('vulnerabilities', {})
              total = sum(meta.values())
              if total == 0:
                  print('No advisories.')
              else:
                  print(f'**{total}** advisor{\"y\" if total == 1 else \"ies\"}:')
                  for sev in ('critical', 'high', 'moderate', 'low', 'info'):
                      n = meta.get(sev, 0)
                      if n: print(f'- {sev}: **{n}**')
              " || echo "(parsing failed)"
              echo ""
            fi
            echo "_Full results in the **static-analysis-${INTENSITY}** artifact and the Security tab._"
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # Job 2 — Dynamic analysis (DAST against a running instance)
  # =========================================================================
  dynamic-analysis:
    name: Dynamic analysis (${{ inputs.intensity }})
    runs-on: ubuntu-latest
    # Extreme scans (ZAP full + Wapiti + SQLMap) can take 60-90 minutes.
    timeout-minutes: 180
    needs: static-analysis

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}

      - name: Write .env from secret (or local fallback for smoke)
        run: |
          if [ -n "${{ secrets.ENV_DEV }}" ]; then
            echo "${{ secrets.ENV_DEV }}" > .env.local
          else
            # Minimal local env so the app boots; production secrets aren't
            # needed for unauthenticated DAST.
            cat > .env.local <<EOF
          DATABASE_URL=postgres://auraqa:auraqa@db:5432/auraqa
          NEXTAUTH_URL=http://localhost:3000
          NEXTAUTH_SECRET=ci-only-secret-not-used-anywhere-else
          AUTH_TRUST_HOST=true
          EOF
          fi

      - name: Build and start Docker services
        run: |
          DOCKER_BUILDKIT=1 docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.dev.yml \
            up -d --build --wait

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "App is ready"; exit 0
            fi
            echo "Waiting for app... ($i/60)"
            sleep 2
          done
          echo "::error::App failed to start"
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml logs
          exit 1

      # -- Always-on (every intensity) ---------------------------------------

      - name: OWASP ZAP — baseline (passive)
        # Passive scan: crawls the app and inspects responses for issues
        # like missing headers, info disclosure, weak ciphers. Does NOT send
        # attack payloads — safe to run anywhere.
        #
        # IMPORTANT: do NOT override -J / -r filenames via cmd_options. The
        # action's bundled artifact-upload step hardcodes the default
        # filenames (report_json.json, report_html.html); overriding makes
        # it error with "File ... does not exist". We rename later when
        # uploading our own artifact.
        uses: zaproxy/action-baseline@v0.15.0
        continue-on-error: true
        with:
          target: ${{ env.APP_URL }}
          allow_issue_writing: false
          fail_action: false

      - name: Capture ZAP baseline reports
        if: always()
        run: |
          # action-baseline writes report_html.html / report_json.json /
          # report_md.md to the workspace root. Copy to our preferred names
          # so the artifact upload + summary block can find them.
          [ -f report_html.html ] && cp report_html.html zap-baseline.html || true
          [ -f report_json.json ] && cp report_json.json zap-baseline.json || true
          ls -la zap-baseline.* || echo "(no ZAP baseline reports)"

      # -- Normal + Extreme --------------------------------------------------

      - name: Nuclei — template-based scanner
        if: inputs.intensity != 'smoke'
        # On normal we run high/critical templates only; on extreme we run
        # the full default ruleset including info-level findings.
        # nuclei-action@v3 collapsed all flag inputs into a single `args:` —
        # severity, output, and any other nuclei flags go there.
        uses: projectdiscovery/nuclei-action@v3
        continue-on-error: true
        with:
          args: |
            -target ${{ env.APP_URL }}
            -severity ${{ inputs.intensity == 'extreme' && 'unknown,info,low,medium,high,critical' || 'high,critical' }}
            -jsonl-export nuclei.json
            -stats
            -no-color

      # -- Extreme only — DESTRUCTIVE ACTIVE SCANS ---------------------------

      - name: OWASP ZAP — full active scan (DESTRUCTIVE)
        if: inputs.intensity == 'extreme'
        # Sends real attack payloads — SQLi, XSS, path traversal, command
        # injection, etc. WILL corrupt test data. Only safe against the
        # ephemeral Docker instance this workflow stands up.
        # Same default-filename rule as the baseline scan above — don't
        # override -J / -r; rename in the capture step below.
        uses: zaproxy/action-full-scan@v0.13.0
        continue-on-error: true
        with:
          target: ${{ env.APP_URL }}
          allow_issue_writing: false
          fail_action: false

      - name: Capture ZAP full-scan reports
        if: inputs.intensity == 'extreme' && always()
        run: |
          [ -f report_html.html ] && cp report_html.html zap-full.html || true
          [ -f report_json.json ] && cp report_json.json zap-full.json || true

      - name: Wapiti — DAST (active)
        if: inputs.intensity == 'extreme'
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "$PWD:/work" -w /work \
            wapitiscanner/wapiti:latest \
            -u ${{ env.APP_URL }} \
            -f html -o wapiti-report.html \
            --scope domain \
            --flush-attacks \
            --verify-ssl 0 \
            -m "common,sql,xss,xxe,csrf,backup,brute_login_form,buster,cookieflags,exec,file,htp,htaccess,methods,nikto,redirect,shellshock,ssrf,wapp"

      - name: SQLMap — SQL injection probe on common endpoints (DESTRUCTIVE)
        if: inputs.intensity == 'extreme'
        continue-on-error: true
        run: |
          # Curated list of endpoints that take user input. SQLMap will try
          # to detect and exploit injection on each one. Output is a tree
          # of session files under sqlmap-output/.
          mkdir -p sqlmap-output
          for url in \
            "${{ env.APP_URL }}/api/search?q=test" \
            "${{ env.APP_URL }}/api/articles?page=1&limit=10" \
            "${{ env.APP_URL }}/api/forum/threads?categoryId=1" \
          ; do
            echo "::group::sqlmap $url"
            docker run --rm --network host \
              -v "$PWD/sqlmap-output:/output" \
              parrotsec/sqlmap:latest \
              -u "$url" \
              --batch \
              --level=3 \
              --risk=2 \
              --random-agent \
              --output-dir=/output \
              || true
            echo "::endgroup::"
          done

      # -- Collect artifacts -------------------------------------------------

      - name: Upload DAST artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-analysis-${{ inputs.intensity }}
          retention-days: 30
          path: |
            zap-baseline.json
            zap-baseline.html
            zap-full.json
            zap-full.html
            nuclei.json
            wapiti-report.html
            sqlmap-output/
          if-no-files-found: ignore

      - name: Dynamic-analysis summary
        if: always()
        # See `run-shell-injection` note on the static-analysis summary above.
        run: |
          {
            echo "## 🔥 Security Scan — Dynamic Analysis (intensity: \`${INTENSITY}\`)"
            echo ""
            if [ "$INTENSITY" = "extreme" ]; then
              echo "> ⚠️ **Destructive scans ran.** Test data on the ephemeral Docker"
              echo "> instance was likely corrupted. The instance has been torn down."
              echo ""
            fi
            echo "| Tool | Output | Status |"
            echo "|---|---|---|"
            for pair in "ZAP baseline:zap-baseline.html" \
                       "ZAP full active:zap-full.html" \
                       "Nuclei:nuclei.json" \
                       "Wapiti:wapiti-report.html"; do
              name="${pair%%:*}"; file="${pair##*:}"
              if [ -f "$file" ]; then echo "| $name | \`$file\` | ✅ produced |"
              else echo "| $name | \`$file\` | — not run |"; fi
            done
            if [ -d sqlmap-output ] && [ -n "$(ls -A sqlmap-output 2>/dev/null)" ]; then
              echo "| SQLMap | \`sqlmap-output/\` | ✅ produced |"
            else
              echo "| SQLMap | \`sqlmap-output/\` | — not run |"
            fi
            echo ""
            # ZAP baseline JSON has a `site[].alerts[]` array with `riskcode`
            # (0=info, 1=low, 2=medium, 3=high). Count by severity.
            for json in zap-baseline.json zap-full.json; do
              if [ -f "$json" ]; then
                echo "### $(basename $json .json)"
                python3 -c "
                import json
                d = json.load(open('$json'))
                buckets = {0:'info',1:'low',2:'medium',3:'high'}
                counts = {v:0 for v in buckets.values()}
                for site in d.get('site', []):
                    for a in site.get('alerts', []):
                        risk = int(a.get('riskcode', 0))
                        counts[buckets.get(risk, 'info')] += 1
                total = sum(counts.values())
                if total == 0:
                    print('No alerts.')
                else:
                    print(f'**{total}** alert(s):')
                    for sev in ('high','medium','low','info'):
                        n = counts.get(sev, 0)
                        if n: print(f'- {sev}: **{n}**')
                " || echo "(parsing failed)"
                echo ""
              fi
            done
            if [ -f nuclei.json ]; then
              echo "### Nuclei"
              total=$(wc -l < nuclei.json || echo 0)
              echo "**$total** finding(s) in \`nuclei.json\` (one per line, JSON-lines)."
              echo ""
            fi
            echo "_Full reports in the **dynamic-analysis-${INTENSITY}** artifact._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop Docker services
        if: always()
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml down -v

  # =========================================================================
  # Job 3 — Hand off findings to the Copilot coding agent
  #
  # Files an issue containing the triage prompt and assigns @Copilot, which
  # picks it up via the GitHub Copilot coding-agent flow and opens a PR
  # against `dev` with the fixes.
  #
  # The agent has to be enabled in the repo for the assignment to take —
  # without it, the issue still gets filed (the step is `continue-on-error`)
  # so a human can pick it up later.
  #
  # Smoke is skipped: it's a pre-merge sanity check that rarely produces
  # actionable findings, so spawning an issue per smoke run is just noise.
  # =========================================================================
  trigger-copilot-fix:
    name: Hand off findings to Copilot
    runs-on: ubuntu-latest
    needs: [static-analysis, dynamic-analysis]
    if: always() && inputs.intensity != 'smoke'
    permissions:
      contents: read
      issues: write
    steps:
      - name: File triage issue and assign Copilot
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          # Header is templated with the actual run ID + URL; the prompt
          # body itself is read from a quoted heredoc so no shell expansion
          # mangles the backticks, $vars-in-comments, or markdown tables.
          header="**Triggered by [Security Scan run #${RUN_ID}](${REPO_URL}/actions/runs/${RUN_ID})** (intensity: \`${INTENSITY}\`)."

          prompt=$(cat <<'PROMPT'
          Review the latest Security Scan workflow run on rstens/Auraqa and open a PR
          that addresses every actionable finding.

          Steps:

          1. Look up the most recent `Security Scan` workflow run via the GitHub MCP
             (mcp__github__actions_list with method=list_workflow_runs,
             resource_id="security.yml"). Use the highest-numbered run with
             conclusion=success or completed. If the user passes a run ID in the
             prompt, use that instead.

          2. Fetch the per-job logs for both jobs in that run via
             mcp__github__get_job_logs with return_content=true. The logs are too
             large for a single tool call — the MCP will save them to a file under
             /root/.claude/projects/.../tool-results/. Parse the JSON wrapper
             (`logs_content` field) and write the inner log to the scratchpad with a
             small Python snippet, then grep for findings.

             Do NOT try to download the artifact ZIPs. The agent proxy blocks Azure
             blob storage (productionresultssa2.blob.core.windows.net) with HTTP 403
             — this is an organization egress policy, do not retry around it.

          3. Extract findings from the logs for every tool that ran:
             - GitLeaks         — secrets in git history
             - npm audit        — registry advisories (look for severity counts)
             - OSV-Scanner      — also visible in the Security tab
             - Trivy fs/image   — Security tab
             - Semgrep          — "Blocking Code Findings" block lists rule + file
             - ZAP baseline     — "WARN-NEW:" lines list the alert + URL count
             - Nuclei           — JSONL with one finding per line
             - ZAP full / Wapiti / SQLMap (extreme only)

          4. For each finding, decide:
             - Real bug → fix the code
             - False positive on a safe sink → suppress with a targeted annotation
               (`// nosemgrep: <rule-id> -- <reason>`) and document the WHY
             - Dev-only / unfixable transitive dep → document as accepted in
               docs/SECURITY.md, do not file
             - Workflow misconfig (deprecated action, bad flag) → fix
               .github/workflows/security.yml

          5. Branch off the latest dev (`git fetch origin dev && git checkout -b
             fix/security-findings-<short-summary> origin/dev`). Apply all fixes.

          6. Verify locally before pushing:
             - npm run lint
             - npm run type-check
             - npm test
             - npm run format:check
             - npm run build
             Fix anything that breaks. Do not push a red branch.

          7. Commit with a body that lists every finding and how it was addressed
             (tool → finding → resolution). Push to origin and open a PR against
             `dev` via mcp__github__create_pull_request. The PR body should mirror
             the commit body and end with a "Test plan" checklist that includes
             "Re-run Security Scan → normal on this branch and verify counts drop."

             Use the existing PR template style (## Summary / ## Test plan, table
             for the ZAP header→alert mapping, before/after counts for npm audit).
             Do not include the model ID anywhere in the PR.

          8. Report the PR URL and a short summary of what was fixed.
          PROMPT
          )

          body=$(printf '%s\n\n---\n\n%s' "$header" "$prompt")

          # Two-step: create the issue, capture the URL, then attempt to
          # assign @Copilot via the REST API. `--assignee` on `gh issue
          # create` only accepts human users in older gh versions, so we
          # use the REST endpoint to add the Copilot bot.
          if ! issue_url=$(gh issue create \
            --repo "$REPO_SLUG" \
            --title "Security Scan #${RUN_ID} — triage findings (${INTENSITY})" \
            --body "$body"); then
            echo "::warning::Failed to create triage issue; skipping Copilot assignment."
            exit 0
          fi

          issue_num="${issue_url##*/}"
          echo "Filed $issue_url"
          if gh api -X POST \
              "/repos/${REPO_SLUG}/issues/${issue_num}/assignees" \
              -f "assignees[]=Copilot" >/dev/null 2>&1; then
            echo "Assigned @Copilot to issue #${issue_num}."
            assigned="✅ assigned to @Copilot"
          else
            echo "::warning::Could not assign @Copilot — assign manually if the coding agent is enabled in this repo."
            assigned="⚠ not assigned (Copilot coding agent not enabled?)"
          fi

          {
            echo "## 🤖 Copilot triage"
            echo ""
            echo "- Issue: $issue_url"
            echo "- Status: $assigned"
            echo ""
            echo "If the coding agent doesn't pick it up automatically, assign @Copilot manually on the issue."
          } >> "$GITHUB_STEP_SUMMARY"
