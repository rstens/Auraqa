###############################################################################
# AuraQA CI Pipeline
#
# Runs on every push and pull request:
#   1. Lint (ESLint)
#   2. Type check (TypeScript)
#   3. Unit/integration tests (Vitest)
#   4. Build (Next.js production build)
###############################################################################

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: auraqa_test
          POSTGRES_USER: auraqa
          POSTGRES_PASSWORD: auraqa_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auraqa -d auraqa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://auraqa:auraqa_password@localhost:5432/auraqa_test
      NEXTAUTH_SECRET: ci-test-secret-at-least-32-characters-long
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
