###############################################################################
# AuraQA CI Pipeline
#
# Runs on every push and pull request:
#   1. Format check (Prettier)
#   2. Lint (ESLint)
#   3. Type check (TypeScript)
#   4. Unit tests (Vitest)
#   5. Docker build + E2E smoke tests (Playwright)
#
# Caching: npm dependencies, Playwright browsers, Docker layers
###############################################################################

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Update npm
        run: npm install -g npm@11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Format check
        # Runs first because formatting failures are the cheapest to diagnose
        # (no compile/no execute) — fail fast and tell the contributor to run
        # `npm run format` locally.
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-test
    # Needed for `docker push` to GHCR in the cache-miss path below.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Write .env from secret
        run: echo "${{ secrets.ENV_DEV }}" > .env.local

      # -- Docker image cache --------------------------------------------------
      #
      # The dev image baked from docker/Dockerfile.dev is pushed to GHCR
      # under a content hash; on subsequent runs with the same hash we pull
      # it instead of rebuilding. Files we hash are exactly those that go
      # *into* the image — package*.json, root configs, src/, public/, and
      # both Dockerfiles. Things that don't affect the image (docs, e2e
      # tests, the workflows themselves) are excluded so they don't churn
      # the cache.
      #
      # Local devs running `docker compose up` without the env vars get the
      # old behavior — compose builds and tags as `auraqa-app-dev:local`.

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute dev image cache key
        id: cache
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          # Hash everything that gets baked into Dockerfile.dev:
          #   - the Dockerfiles themselves (both — prod multi-stage shares deps)
          #   - npm dependency manifest + lock
          #   - root config files (next/tsc/drizzle/postcss/eslint) — these
          #     ride in via `COPY . .` and influence build output
          #   - src/, public/ — same reason; the user's request maps "app +
          #     database changes" to "rebuild", and these are where that lives
          #
          # Things deliberately excluded so they don't churn the cache:
          # docs/, e2e/, scripts/, .github/, the README, vitest config,
          # playwright config — none of them are needed at image runtime.
          CONTENT_HASH: ${{ hashFiles('docker/Dockerfile', 'docker/Dockerfile.dev', 'package.json', 'package-lock.json', 'next.config.ts', 'tsconfig.json', 'drizzle.config.ts', 'postcss.config.mjs', 'eslint.config.mjs', 'src/**', 'public/**') }}
        run: |
          # GHCR namespaces must be lowercase; repo owner casing is preserved
          # by GitHub but Docker will reject mixed case.
          owner_lc=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          repo="ghcr.io/${owner_lc}/auraqa-app-dev"
          # 16 hex chars is plenty of entropy for a per-repo tag and keeps
          # the image name readable in the GHCR UI.
          tag="${CONTENT_HASH:0:16}"
          {
            echo "repo=$repo"
            echo "tag=$tag"
            echo "image=${repo}:${tag}"
          } >> "$GITHUB_OUTPUT"
          echo "Image cache target: ${repo}:${tag}"

      - name: Try to pull cached dev image
        id: pull
        continue-on-error: true
        env:
          IMAGE: ${{ steps.cache.outputs.image }}
        run: |
          if docker pull "$IMAGE" 2>/dev/null; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Reusing cached image $IMAGE — no rebuild needed."
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No cached image for this content hash — will build fresh and push."
          fi

      - name: Build and start Docker services
        env:
          IMAGE_REPO: ${{ steps.cache.outputs.repo }}
          IMAGE_TAG: ${{ steps.cache.outputs.tag }}
        # No `--build` flag: compose builds only if the named image isn't
        # already present (i.e. the pull step missed). On a hit, it boots
        # straight from the pulled image.
        run: |
          DOCKER_BUILDKIT=1 docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml up -d --wait

      - name: Push newly-built image to GHCR
        # Only on cache miss — on a hit we already have what's in the
        # registry. `if: success()` (the default) ensures we don't push a
        # half-built image after a failed boot.
        if: steps.pull.outputs.hit == 'false'
        env:
          IMAGE: ${{ steps.cache.outputs.image }}
          REPO: ${{ steps.cache.outputs.repo }}
        run: |
          # Tag floating `:latest` alongside the content-hash tag so
          # external consumers (e.g. a future preview-deploy job) can grab
          # the most-recent build without knowing the hash.
          docker tag "$IMAGE" "${REPO}:latest"
          docker push "$IMAGE"
          docker push "${REPO}:latest"

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "App is ready"
              exit 0
            fi
            echo "Waiting for app... ($i/30)"
            sleep 2
          done
          echo "App failed to start"
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml logs
          exit 1

      - name: Update npm
        run: npm install -g npm@11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run E2E smoke tests
        # Reporters are configured in playwright.config.ts (list + html + github).
        # No --reporter override here so the HTML report lands at
        # playwright-report/ for the upload step below.
        env:
          CI: "true"
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          # Retain for ~2 weeks — these are debugging aids, not deliverables.
          retention-days: 14
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload raw test results (traces, screenshots, videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          retention-days: 14
          path: test-results/
          if-no-files-found: ignore

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Playwright E2E Report"
            echo ""
            if [ -f playwright-report/index.html ]; then
              echo "HTML report uploaded as the **playwright-html-report** artifact (above)."
              echo "Download and open \`index.html\` for traces, screenshots, and per-test details."
            else
              echo "_No HTML report was produced — Playwright may have failed before any test ran._"
            fi
            echo ""
            if [ -d test-results ] && [ "$(ls -A test-results 2>/dev/null)" ]; then
              failed=$(find test-results -mindepth 1 -maxdepth 1 -type d | wc -l)
              echo "Captured artifacts for **$failed** failed test(s) under \`test-results/\`."
            fi
            echo ""
            # Per-test list with counts — emits every run, even on success.
            # Reads playwright-results.json produced by the json reporter.
            python3 scripts/playwright-summary.py
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop Docker services
        if: always()
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml down -v
