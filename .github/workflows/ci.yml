###############################################################################
# AuraQA CI Pipeline
#
# Runs on every push and pull request:
#   1. Lint (ESLint)
#   2. Type check (TypeScript)
#   3. Unit tests (Vitest)
#   4. Docker build + E2E smoke tests (Playwright)
#
# Caching: npm dependencies, Playwright browsers, Docker layers
###############################################################################

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Update npm
        run: npm install -g npm@11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Write .env from secret
        run: echo "${{ secrets.ENV_DEV }}" > .env.local

      - name: Build and start Docker services
        run: |
          DOCKER_BUILDKIT=1 docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml up -d --build --wait

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "App is ready"
              exit 0
            fi
            echo "Waiting for app... ($i/30)"
            sleep 2
          done
          echo "App failed to start"
          docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml logs
          exit 1

      - name: Update npm
        run: npm install -g npm@11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run E2E smoke tests
        # Reporters are configured in playwright.config.ts (list + html + github).
        # No --reporter override here so the HTML report lands at
        # playwright-report/ for the upload step below.
        env:
          CI: "true"
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          # Retain for ~2 weeks — these are debugging aids, not deliverables.
          retention-days: 14
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload raw test results (traces, screenshots, videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          retention-days: 14
          path: test-results/
          if-no-files-found: ignore

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Playwright E2E Report"
            echo ""
            if [ -f playwright-report/index.html ]; then
              echo "HTML report uploaded as the **playwright-html-report** artifact (above)."
              echo "Download and open \`index.html\` for traces, screenshots, and per-test details."
            else
              echo "_No HTML report was produced — Playwright may have failed before any test ran._"
            fi
            echo ""
            if [ -d test-results ] && [ "$(ls -A test-results 2>/dev/null)" ]; then
              failed=$(find test-results -mindepth 1 -maxdepth 1 -type d | wc -l)
              echo "Captured artifacts for **$failed** failed test(s) under \`test-results/\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop Docker services
        if: always()
        run: docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml down -v
